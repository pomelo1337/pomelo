95", "name": "芯片ETF华夏", "price": 1.19, "score": 23.3, "bang": "科技", "stage": "空头"}, {"code": "588000", "name": "科创50ETF华夏", "price": 1.81, "score": 21.4, "bang": "科技", "stage": "空头"}, {"code": "515880", "name": "通信ETF国泰", "price": 0.65, "score": 20.2, "bang": "科技", "stage": "空头"}, {"code": "512000", "name": "券商ETF华宝", "price": 0.52, "score": 20.1, "bang": "金融", "stage": "多头"}, {"code": "512880", "name": "证券ETF国泰", "price": 1.09, "score": 20.1, "bang": "金融", "stage": "多头"}, {"code": "159949", "name": "创业板50ETF华安", "price": 1.67, "score": 17.1, "bang": "成长", "stage": "空头"}, {"code": "159986", "name": "消费100ETF", "price": 1.04, "score": 15.8, "bang": "科技", "stage": "空头"}];
const INIT = [{"code": "159558", "name": "半导体设备ETF易方达", "price": 1.16, "stage": "空头排列", "risk": 37.6, "buylow": 0.91, "buyhigh": 0.95, "sella": 1.12, "res": 1.16, "target": 1.3, "stop": 0.9, "rr": 0.54, "cost": 1.155}, {"code": "588110", "name": "科创成长ETF广发", "price": 0.61, "stage": "空头排列", "risk": 39.7, "buylow": 0.49, "buyhigh": 0.51, "sella": 0.6, "res": 0.69, "target": 0.69, "stop": 0.49, "rr": 0.61, "cost": 0.536}, {"code": "512010", "name": "医药ETF易方达", "price": 0.4, "stage": "多头排列", "risk": 43.6, "buylow": 0.36, "buyhigh": 0.38, "sella": 0.4, "res": 0.41, "target": 0.41, "stop": 0.35, "rr": 0.21, "cost": 0.4}];
// 激进风格全局配置: 剔除低弹性保守赛道(红利/宽基/黄金/银行/证券/债券), 追求高弹性高收益
const AGGR = { selval: 55 };
function getReco(){
  let _have = currentList();
  const AGGR_EXCLUDE = ['红利','上证50','沪深300','中证500','中证1000','深证100','黄金','银行','证券','券商','债券','转债','国债','货币','保险','央企','价值'];
  return POOL.filter(x=>x && x.score>=AGGR.selval && !_have.includes(x.code)
    && !AGGR_EXCLUDE.some(k=> (x.name||'').includes(k) || (x.bang||'').includes(k)) )
    .sort((a,b)=>(b.score||0)-(a.score||0));
}
const LS_LIST = 'hold_list';
const LS_QTY = 'hold_qty';
const LS_BUY = 'hold_buy';
const LS_ASSETS = 'hold_assets';   // 总资产

// ---- 持仓数据源: 优先从INIT(有点位)否则POOL(有现价/评分) ----
function getEtf(code){
  let i = INIT.find(x=>x.code==code);
  let p = POOL.find(x=>x.code==code);
  if(i) return i;
  if(p) return {code:p.code,name:p.name,price:p.price,score:p.score,stage:'-',risk:null,buylow:null,buyhigh:null,sella:null,res:null,target:null,stop:null,rr:null};
  return null;
}

// ---- 当前持仓列表 (localStorage记忆) ----
function currentList(){
  let d = {};
  try{d = JSON.parse(localStorage.getItem(LS_LIST)||'[]')}catch(e){}
  if(!d || !d.length) d = INIT.map(x=>x.code);   // 默认持仓
  return d;
}
function listDedup(codes){ return [...new Set(codes)]; }
function saveList(codes){ localStorage.setItem(LS_LIST, JSON.stringify(listDedup(codes))); }

// ---- 持仓数据 ----
function getQty(code){ try{let s=JSON.parse(localStorage.getItem(LS_QTY)||'{}'); return s[code]||0}catch(e){return 0} }
function getBuy(code){ try{let s=JSON.parse(localStorage.getItem(LS_BUY)||'{}'); if(s[code]>0) return s[code]}catch(e){} let e=getEtf(code); return e? (e.cost||0) : 0; }
function setStore(LS, code, val){ let s={}; try{s=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){s={}} s[code]=val; localStorage.setItem(LS, JSON.stringify(s)); }

function fmt(x){ return isFinite(x)?Number(x).toFixed(2):'-'; }
function money(x){ return isFinite(x)?Number(x).toLocaleString(undefined,{maximumFractionDigits:0}):'-'; }

// ---- 渲染持仓卡 ----
function render(){ 
  let codes = currentList();
  let box = document.getElementById('holds'); box.innerHTML='';
  codes.forEach(function(code,idx){
    let e = getEtf(code);
    if(!e) return;
    let q = getQty(code), buy = getBuy(code), price = e.price||0;
    let mv = q*price, cost = q*buy, pnl = mv-cost, pct = cost>0? pnl/cost*100 : 0;
    let pnlcolor = pnl>=0 ? '#16a34a' : '#dc2626';
    let ptsHtml = '';
    if(e.buylow) ptsHtml += ptsLine('买区', e.buylow+' ~ '+e.buyhigh) + ptsLine('卖区', e.sella) + ptsLine('压力', e.res) + ptsLine('目标', e.target) + ptsLine('止损', e.stop);
    let card = document.createElement('div'); card.className='card etf';
    card.innerHTML = `
      <div class="eh">
        <div><span class="tag">${e.code}</span><b>${e.name}</b>
          <span class="stage">${e.stage||'-'}</span></div>
        <div class="price"><b class="nprice">${fmt(price)}</b><span class="chg">评分 ${e.score!=null?e.score:'-'}</span></div>
      </div>
      <div class="emeta">
        <span>风险指数 <b>${fmt(e.risk)}</b></span>
        <span>风险收益比 <b>${e.rr!=null?e.rr:'-'}</b></span>
      </div>
      ${ptsHtml?'<div class="pts">'+ptsHtml+'</div>':''}
      <div class="qty">
        <label>数量（份）</label>
        <input type="number" class="qin" data-code="${code}" data-i="${idx}" value="${q}" min="0" placeholder="如4000">
        <label>买入价（元）</label>
        <input type="number" class="bin" data-code="${code}" value="${buy||''}" min="0" step="0.001" placeholder="如1.15">
        <button class="del" data-code="${code}">✕ 移除</button>
      </div>
      <div class="calc">
        <span>市值 <b class="cmv">${money(mv)}</b></span>
        <span>浮动盈亏 <b class="cpnl" style="color:${pnlcolor}">${money(pnl)}</b></span>
        <span>浮盈率 <b class="cpct" style="color:${pnlcolor}">${pct.toFixed(2)}%</b></span>
      </div>`;
    box.appendChild(card);
  });
  // 绑定事件
  box.querySelectorAll('.qin').forEach(inp=>{ inp.addEventListener('input',()=>{ setStore(LS_QTY, inp.dataset.code, parseFloat(inp.value)||0); render(); }); });
  box.querySelectorAll('.bin').forEach(inp=>{ inp.addEventListener('input',()=>{ setStore(LS_BUY, inp.dataset.code, parseFloat(inp.value)||0); render(); }); });
  box.querySelectorAll('.del').forEach(btn=>{ btn.addEventListener('click',()=>{ let nl=currentList().filter(c=>c!=btn.dataset.code); saveList(nl); render(); }); });
}

function ptsLine(label, val){ return '<div><span>'+label+'</span><b>'+ (val!==undefined && val!==null ? val : '-') +'</b></div>'; }

// ---- 添加持仓 ----
function addHold(){
  let sel = document.getElementById('poolSel');
  if(!sel.value){ alert('请先选一只ETF'); return; }
  let nl = currentList(); nl.push(sel.value); saveList(nl); render();
  sel.value='';
}

// ---- 下拉填充 ----
function fillPool(){
  let sel = document.getElementById('poolSel');
  let have = currentList();
  let opts = POOL.filter(x=>x && !have.includes(x.code));
  sel.innerHTML = '<option value="">— 从以下选择一只ETF加入持仓 —</option>';
  opts.forEach(function(o){
    let oo = document.createElement('option'); oo.value = o.code;
    oo.textContent = o.name + ' ('+o.code+') · '+ (o.score!=null?o.score:'-') +'分';
    sel.appendChild(oo);
  });
}

// ---- 总资产 ----
function totalAssets(){ let v=parseFloat(document.getElementById('totalAsset').value); return isNaN(v)||v<0?0:v; }

window.onload = function(){
  let ta = document.getElementById('totalAsset');
  let a = localStorage.getItem(LS_ASSETS); if(a && !isNaN(parseFloat(a))) ta.value = parseFloat(a);
  ta.addEventListener('input',function(){ let v=parseFloat(this.value); if(!isNaN(v)&&v>=0) localStorage.setItem(LS_ASSETS,this.value); });
  render(); fillPool();
};

// ============ 生成操作建议 ============
function genAdvice(){
  let bm = document.getElementById('advout'); bm.classList.add('show');
  let html = '<h3 style="margin-bottom:10px">📋 操作建议 · 分步执行</h3>';
  let codes = currentList();
  let bought = false;

  // 第一步 卖出评估
  let sell_html='', sellTotal=0, sellHas=false, heldMV=0, heldCnt=0;
  let nbsell=0; // 有效数量持仓数
  codes.forEach(function(code){
    let e = getEtf(code); if(!e) return;
    let q = getQty(code); if(q<=0){ sell_html+='<div class="wa">· <b>'+e.name+'</b> 未输入持仓数量，跳过。</div>'; return; }
    nbsell++; heldCnt++;
    let price=e.price||0, buy=getBuy(code);
    heldMV += q*price;
    let mv=q*price, costv=q*buy, pnl=mv-costv, pct=costv>0? pnl/costv*100:0;
    let pnlnote = pct>=0 ? '<b style="color:#16a34a">盈+'+pct.toFixed(1)+'%</b>' : '<b style="color:#dc2626">亏'+pct.toFixed(1)+'%</b>';
    let sella=e.sella||0, stop=e.stop||0, target=e.target||0, stage=String(e.stage||'');
    let sold=null;
    if(stop>0 && price<=stop){
      sold=true; let amt=q*price; sellTotal+=amt; sellHas=true;
      sell_html+='<div class="op se">🚨 <b>'+e.name+'</b> 现价 '+fmt(price)+' 跌破止损线 '+fmt(stop)+'（买入价'+fmt(buy)+'，'+pnlnote+'）。<br>　<b>卖：全部 '+money(q)+' 份</b>（约 '+money(amt)+' 元）坚决离场。</div>';
    } else if(sella>0 && price>=sella){
      sold=true; let ratio=0.6, sell=Math.round(q*ratio), amt=sell*price; sellTotal+=amt; sellHas=true;
      sell_html+='<div class="op se">🛑 <b>'+e.name+'</b> 现价 '+fmt(price)+' 触及卖区 '+fmt(sella)+'（'+stage+' · 买入价'+fmt(buy)+'，'+pnlnote+'）。<br>　<b>卖：60% 即 '+money(sell)+' 份</b>（约 '+money(amt)+' 元）。</div>';
    } else if(target>0 && price>=target){
      sold=true; let ratio=0.3, sell=Math.round(q*ratio), amt=sell*price; sellTotal+=amt; sellHas=true;
      sell_html+='<div class="op se">💰 <b>'+e.name+'</b> 已达目标位 '+fmt(target)+'（买入价'+fmt(buy)+'，'+pnlnote+'）。<br>　<b>卖：30% 即 '+money(sell)+' 份</b>（约 '+money(amt)+' 元）锁盈。</div>';
    }
    if(!sold){
      sell_html+='<div class="wa">🤔 <b>'+e.name+'</b>（'+stage+' · 买入价'+fmt(buy)+'，'+pnlnote+'）未触发卖点，暂不卖出。</div>';
    }
  });
  if(nbsell===0){
    sell_html+='<div class="wa">📌 尚未输入任何持仓数量。填好每只持仓的<strong>数量</strong>才能评估卖出。</div>';
  } else if(!sellHas){
    sell_html+='<div class="wa">✅ 均未触发卖出信号，无强制减仓/止损。</div>';
  } else {
    sell_html+='<div class="wa">　↳ 卖出合计可回笼约 <b>'+money(sellTotal)+' 元</b>，可用于再配置。</div>';
  }
  html += '<div style="margin:10px 0 4px;font-weight:700;color:#9a3412">【第一步 · 该抛多少】卖出评估</div>'+sell_html;

  // 第二步 买入推荐 —— 资金闭环：买入金额<=实际可动用资金(卖出腾出+新增现金)
  let TA = totalAssets();
  // 持仓市值 heldMV 已在第一步累加；现金 = 总资产 - 持仓市值(满仓则为0)
  let cashNew = TA>0 ? Math.max(0, TA- heldMV) : 0;           // 额外可追加的现金
  let availCash = sellTotal + cashNew;                          // 实际能用来买入的钱
  if(TA>0){
    let pick = getReco().slice(0,3);
    let ratios = [0.50, 0.30, 0.20];
    let rows='', buySum=0;
    if(availCash<=1){
      // 已满仓且无卖出：无钱可买
      rows = '<div class="op wa" style="width:100%">💡 目前资金已全部锁定在持仓中（市值约 '+money(heldMV)+' 元），且第一步未触发卖出。若要买入下方强势标的，需<strong>先卖出部分持仓</strong>腾出资金，或<strong>追加现金</strong>。不做多余买入。</div>';
      buySum=0;
    } else {
      let src='';
      if(sellTotal>0 && cashNew>0) src='卖出持仓腾出 '+money(sellTotal)+' 元 + 新增现金 '+money(cashNew)+' 元';
      else if(sellTotal>0) src='卖出持仓腾出的 '+money(sellTotal)+' 元';
      else if(cashNew>0) src='新增现金 '+money(cashNew)+' 元';
      rows = '<div class="wa" style="width:100%">💰 可动用买入资金：'+src+'（合计 <b>'+money(availCash)+' 元</b>）。按强势标的 50/30/20% 比例配置：</div>';
      pick.forEach(function(r,k){
        let price=r.price||0;
        let amt = Math.floor(availCash*ratios[k]/100)*100;
        if(amt<1) return;
        let shares = price>0 ? Math.max(0, Math.floor(amt/price/100)*100) : 0;
        buySum += amt;
        rows+='<div class="op bu" style="width:100%">🔺 <b>'+r.name+'</b>（'+r.code+'，评分'+r.score+'）<br>　<b>买：'+money(shares)+' 份</b>（约 '+money(amt)+' 元 · 占可动用资金'+Math.round(ratios[k]*100)+'%）。</div>';
      });
      rows += '<div class="op" style="background:#f5f3ff;border-color:#ddd6fe;width:100%"><b style="color:#6d28d9">本次买入合计：'+money(buySum)+' 元</b>（= 可动用资金，不超总资产 '+money(TA)+'）。全部从持仓/资金池内部调配，不产生额外投入。</div>';
    }
    html += '<div style="margin:14px 0 4px;font-weight:700;color:#065f46">【第二步 · 买什么/买多少】买入推荐（仅用好已腾出的资金）</div>'+rows;
  } else {
    html += '<div style="margin:14px 0 4px;font-weight:700;color:#065f46">【第二步 · 买什么/买多少】买入推荐</div><div class="wa">请在【总资产】输入你的本金金额，系统会把「卖出腾出的资金 + 新增现金」重新配置到强势标的，资金始终不超总资产。</div>';
  }

  // 第三步 组合再平衡
  let balHtml='', totalMv=0;
  let hs = codes.map(function(c){ let e=getEtf(c); return {e:e, q:getQty(c), mv:(e?e.price:0)*getQty(c)}; }).filter(h=>h.q>0 && h.e);
  if(hs.length){
    totalMv = hs.reduce(function(s,h){return s+h.mv},0);
    hs.forEach(function(h){
      let share = totalMv>0 ? h.mv/totalMv*100 : 0;
      let buy=getBuy(h.e.code), pnl = h.mv - h.q*buy, pct = (h.q*buy)>0? pnl/(h.q*buy)*100 : 0;
      let pc = pct>=0 ? '<b style="color:#16a34a">盈'+pct.toFixed(1)+'%</b>' : '<b style="color:#dc2626">亏'+pct.toFixed(1)+'%</b>';
      balHtml+='<div class="wa" style="margin:2px 0">· <b>'+h.e.name+'</b> 占组合 '+share.toFixed(1)+'% · '+pc+'</div>';
    });
    let maxH = hs.reduce((a,b)=> a.mv>=b.mv? a:b);
    let maxShare = totalMv>0? maxH.mv/totalMv*100:0;
    if(maxShare>70) balHtml+='<div class="op se" style="margin-top:6px">⚠️ 组合集中 '+maxH.e.name+'（'+maxShare.toFixed(1)+'%），建议分散到第二步推荐标的。</div>';
    else if(hs.some(h=> (h.e.rr!=null && h.e.rr<0.6))) balHtml+='<div class="op bu" style="margin-top:6px">占比均衡，但部分持仓风险收益比偏低，可向更高收益标的调仓。</div>';
    else balHtml+='<div class="wa">占比分散、盈亏结构合理，维持现有组合。</div>';
  }
  if(balHtml) html += '<div style="margin:14px 0 4px;font-weight:700;color:#4f46e5">【第三步 · 组合再平衡】已持占比与盈亏</div>'+balHtml;

  bm.innerHTML = html;
}
</script></body></html>
